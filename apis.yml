aid: rhino
name: Rhino
description: 'Rhino (SayRhino) is a New York based insurtech that replaces the traditional
  cash security deposit with low-cost security deposit insurance, alongside cash deposit
  management, renters insurance and a renter guarantee product. Founded in 2017 and
  now operating alongside Jetty, Rhino sells through property owners and managers across
  the United States and integrates with the major property management systems including
  Yardi, RealPage, Entrata, Rent Manager, MRI and Salesforce. Its public machine-readable
  surface is the SayRhino Partner API (v2) — an OAuth 2.0 client-credentials REST API,
  documented with a live OpenAPI 3.0.3 definition and a Redoc reference, for creating
  and updating insurance prospects, reading eligibility offers and coverage, and managing
  webhook endpoints and deliveries across fifteen prospect, policy, policy-application
  and delinquency events.'
