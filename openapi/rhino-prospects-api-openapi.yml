                      - self_employed
                      - unemployed
                      - retired
                      - corporation
                      type: string
                    first_name:
                      type: string
                    has_ssn:
                      type: boolean
                    last_name:
                      type: string
                    lease_end_date:
                      type: string
                    lease_start_date:
