openapi: 3.2.0
info:
  description: API for third-party partners to create and manage insurance prospects through the SayRhino
    platform.
  title: SayRhino Partner Prospects API
  version: v2
security:
- bearerAuth: []
tags:
- name: Prospects
paths:
