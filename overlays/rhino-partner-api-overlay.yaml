- target: $.paths['/partners/{owner_slug}/webhooks/endpoints/{endpoint_id}/deliveries'].get
  update:
    operationId: listWebhookDeliveries
- target: $.paths['/partners/{owner_slug}/webhooks/endpoints/{endpoint_id}/deliveries/{id}'].get
