x-source: openapi/rhino-partner-api-openapi.json
x-notes: >-
  Non-destructive enhancements over Rhino's published spec. The harvested definition is
  never mutated. These actions add the server object the spec omits, stable operationIds
  (the spec declares none, which blocks SDK generation, Arazzo workflows and MCP tool
  binding), the OAuth 2.0 client-credentials security scheme the /token endpoint really
  implements, and API Evangelist artifact cross-links. All values are taken from the
  provider's own published surface — nothing is invented.
actions:
- target: $
  description: Add the production server the spec omits (it declares no servers[]).
  update:
    servers:
    - url: https://api.prod.sayrhino.com
      description: Production
- target: $.info
  update:
    x-apievangelist-slug: rhino
    x-apievangelist-artifacts:
      authentication: authentication/rhino-authentication.yml
      conventions: conventions/rhino-conventions.yml
      errors: errors/rhino-problem-types.yml
      data_model: data-model/rhino-data-model.yml
      webhooks: asyncapi/rhino-webhooks.yml
      sandbox: sandbox/rhino-sandbox.yml
      lifecycle: lifecycle/rhino-lifecycle.yml
    contact:
      name: Rhino Partner Success
      url: https://portal.sayrhino.com/users/sign_in
- target: $.components.securitySchemes
  description: Model the OAuth 2.0 client-credentials grant that POST /token actually
    implements; the spec only declares the bearer half.
  update:
    partnerOAuth:
      type: oauth2
      description: OAuth 2.0 client-credentials grant. Credentials and the audience
        identifier are issued during partner onboarding.
      flows:
        clientCredentials:
          tokenUrl: https://api.prod.sayrhino.com/token
          scopes: {}
- target: $.paths['/token'].post
  update:
    operationId: requestAccessToken
- target: $.paths['/partners/{owner_slug}/prospects'].post
  update:
    operationId: upsertProspect
    x-idempotency:
      mechanism: natural-key upsert
      key_fields: [source, source_prospect_id]
      scope: owner_slug
- target: $.paths['/partners/{owner_slug}/prospects/{source}/{source_prospect_id}'].get
  update:
    operationId: getProspect
- target: $.paths['/partners/{owner_slug}/webhooks/endpoints'].get
  update:
    operationId: listWebhookEndpoints
- target: $.paths['/partners/{owner_slug}/webhooks/endpoints'].post
