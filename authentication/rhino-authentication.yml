  notes: >-
    The OpenAPI declares a single securityScheme (http bearer, JWT) applied globally,
    but the token is minted by a first-class OAuth 2.0 client-credentials endpoint
    documented in the same spec (POST /token). The spec does not model that endpoint
    as an oauth2 securityScheme, so the mechanical derive saw only the bearer half —
    this file records both halves of the real contract.
